plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Load keystore properties from local file (not committed to git)
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def hasReleaseKeystoreConfig = keystorePropertiesFile.exists() &&
        ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { key ->
            keystoreProperties[key]?.toString()?.trim()
        }

def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains('release') || taskName.toLowerCase().contains('bundle')
}

android {
    namespace = "com.vanshdevstudio.devsphere"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    // AGP < 8.5.1 workaround for 16 KB page-size compatibility on Play.
    // This forces compressed JNI libs instead of relying on uncompressed ZIP alignment.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Production package name - unique for Play Store
        applicationId = "com.vanshdevstudio.devsphere"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (hasReleaseKeystoreConfig) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            // Debug build - no obfuscation
            signingConfig signingConfigs.debug
        }
        release {
            // Enable code shrinking and obfuscation for release builds
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            if (releaseTaskRequested && !hasReleaseKeystoreConfig) {
                throw new GradleException('Release signing is not configured. Copy android/keystore.properties.template to android/keystore.properties and fill in the release keystore values before building a Play Store artifact.')
            }
            
            // Debug signing remains available for non-release tasks only.
            signingConfig hasReleaseKeystoreConfig ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.core:core:1.17.0"
    implementation "androidx.activity:activity-ktx:1.9.3"
}

